name: Sign registry
description: >
  Signs registry/index.toml, registry/blocklist.toml and every plugin
  manifest.toml of the plugin-registry branch with the Pairee release key
  (cargo xtask sign-registry) and commits the changed .minisig files. Used by
  the workflow on the plugin-registry branch (on every change) and by
  refresh-registry.yml on master (weekly, so the index never goes stale).

inputs:
  minisign-secret-key:
    description: Contents of the release secret key (MINISIGN_SECRET_KEY).
    required: true
  minisign-password:
    description: Password of the key, if it has one.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The newest tip of the branch, not the pushed commit: a run that
    # waited for another one signs what is there now.
    - name: Checkout plugin-registry
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: plugin-registry
        path: registry-branch

    - name: Checkout Pairee (signing tool and pinned key)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: master
        path: pairee
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
      with:
        toolchain: stable

    - name: Install minisign
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq minisign

    # The key only reaches this step's environment (never a command line or
    # a log); cargo xtask writes it to a private temporary file.
    - name: Sign
      shell: bash
      working-directory: pairee
      env:
        MINISIGN_SECRET_KEY: ${{ inputs.minisign-secret-key }}
        MINISIGN_PASSWORD: ${{ inputs.minisign-password }}
      run: |
        set -euo pipefail
        if [ -z "$MINISIGN_SECRET_KEY" ]; then
          echo "::error::Repository secret MINISIGN_SECRET_KEY is not set; refusing to leave the registry unsigned."
          exit 1
        fi
        cargo xtask sign-registry "$GITHUB_WORKSPACE/registry-branch/registry"

    # GITHUB_TOKEN pushes never start workflows, so this does not loop.
    - name: Commit signatures
      shell: bash
      working-directory: registry-branch
      run: |
        set -euo pipefail
        # A pathspec `*` also matches `/`: every signature in registry/.
        git add -A -- 'registry/*.minisig'
        if git diff --cached --quiet; then
          echo "Signatures unchanged."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -q -m "registry: sign index, blocklist and manifests [skip ci]"
        git push origin HEAD:plugin-registry
