name: Build dependencies
description: >-
  System packages Pairee needs to build: pkg-config and the OpenSSL headers on
  Linux, pkg-config on macOS, the Strawberry Perl that builds the vendored
  OpenSSL of libssh2 on Windows, plus any extra apt packages a job needs.

inputs:
  apt-extra:
    description: Extra apt packages to install on Linux (space separated).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Linux build deps
      if: runner.os == 'Linux'
      shell: bash
      env:
        APT_EXTRA: ${{ inputs.apt-extra }}
      run: |
        sudo apt-get update -qq
        # shellcheck disable=SC2086 # APT_EXTRA is a word list
        sudo apt-get install -y -qq pkg-config libssl-dev $APT_EXTRA

    - name: Install macOS build deps
      if: runner.os == 'macOS'
      shell: bash
      run: brew install pkg-config

    # openssl-src runs OpenSSL's Configure with `perl`; under the bash shell
    # that is Git's MSYS perl, which cannot configure an MSVC build. The
    # image ships Strawberry Perl: point openssl-src at it.
    - name: Use Strawberry Perl for OpenSSL
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $perl = 'C:\Strawberry\perl\bin\perl.exe'
        if (-not (Test-Path $perl)) {
          choco install strawberryperl --no-progress -y
        }
        if (-not (Test-Path $perl)) { throw "Strawberry Perl not found at $perl" }
        "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
