# TEMPLATE for the `plugin-registry` branch: it is NOT a workflow of this
# branch. Copy it to `.github/workflows/sign-index.yml` on `plugin-registry`
# (see docs/technical/plugin-registry-spec.md, "How the registry is
# signed").
#
# Signs the registry after every push that changes it, and whenever it is
# started by hand or by the weekly refresh on master (GitHub only runs
# `schedule` triggers from the default branch): `index.toml` and
# `blocklist.toml` get a trusted comment with a serial and a timestamp,
# which Pairee requires to refuse replayed (older serial) and frozen (older
# than `registry_max_age_days`, 30 days by default) indexes; every plugin
# `manifest.toml` is signed by path. The signing tool is `cargo xtask
# sign-registry` from master, with the release key (repository secrets
# `MINISIGN_SECRET_KEY` and, if the key has one, `MINISIGN_PASSWORD`, as in
# release.yml); each signature is checked against the key embedded in
# Pairee before anything is committed.
#
# Everything pushed to `plugin-registry` gets signed: the branch must only
# take reviewed pull requests.
name: Sign registry

on:
  push:
    branches:
      - plugin-registry
    paths:
      - 'registry/**/*.toml'
  workflow_dispatch:

permissions:
  contents: read

# One signing run at a time, so serials never collide; none is cancelled.
concurrency:
  group: sign-registry
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sign:
    name: Sign index, blocklist and manifests
    runs-on: ubuntu-latest
    # Optional: required reviewers on this environment gate every run.
    # environment: registry-signing
    permissions:
      contents: write
    steps:
      # The steps are the shared action on master, which the weekly refresh
      # (refresh-registry.yml on master) runs too.
      - uses: FittyAr/Pairee/.github/actions/sign-registry@master
        with:
          minisign-secret-key: ${{ secrets.MINISIGN_SECRET_KEY }}
          minisign-password: ${{ secrets.MINISIGN_PASSWORD }}
