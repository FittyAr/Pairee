name: Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # release.yml runs every check before building a release.
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; runs on the
# main branch and release runs are never cancelled.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Align JS actions with Node 24 (same policy as release.yml).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Third-party actions are pinned by commit SHA (the comment names the
# release); update the SHA and the comment together.
jobs:
  policy:
    name: Policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Crate roots are where a crate-wide allow would sit: the library, the
      # binaries, the examples, xtask and the fuzz targets.
      - name: Forbid crate-level clippy::all / warnings allows
        shell: bash
        run: |
          shopt -s nullglob
          [ -f src/lib.rs ] || { echo "::error::src/lib.rs not found"; exit 1; }
          roots=(src/lib.rs src/main.rs src/bin/*.rs examples/*.rs xtask/src/main.rs fuzz/fuzz_targets/*.rs)
          if grep -nE '^[[:space:]]*#!\[allow\([^]]*\b(clippy::all|warnings)\b' "${roots[@]}"; then
            echo "::error::crate roots must not allow clippy::all or warnings — fix lints instead"
            exit 1
          fi
          echo "Policy OK: no crate-level clippy::all / warnings allow in ${#roots[@]} crate roots"

      - name: Translations and help pages (scripts/check_translations.py)
        shell: bash
        run: python scripts/check_translations.py

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Prebuilt latest cargo-deny: the Docker-based action pulled its image
      # from Docker Hub on every run and failed on its rate limits.
      - name: Install cargo-deny
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny

      - name: Check licenses, advisories, bans and crate sources
        run: cargo deny check

  typos:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check spelling (configured in _typos.toml)
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  msrv:
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          version=$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error::rust-version is not declared in Cargo.toml"
            exit 1
          fi
          echo "MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install build deps
        uses: ./.github/actions/build-deps

      - name: Check all targets with the MSRV toolchain
        run: cargo check --workspace --all-targets --locked

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install build deps
        uses: ./.github/actions/build-deps

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The ARM64 Windows release is cross-compiled on an x64 runner, vendored
  # OpenSSL (libssh2) included; building it here catches a break before a
  # release does.
  windows-arm64:
    name: Build (windows-arm64)
    runs-on: windows-latest
    needs: policy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: aarch64-pc-windows-msvc

      - name: Install build deps
        uses: ./.github/actions/build-deps

      - name: Build for ARM64
        run: cargo build --locked --target aarch64-pc-windows-msvc

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    needs: policy
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install build deps
        uses: ./.github/actions/build-deps

      - name: Build documentation (warnings are errors)
        run: cargo doc --no-deps --locked

  test:
    name: Run tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: the aarch64 Linux release target, run natively.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install build deps
        uses: ./.github/actions/build-deps

      - name: Run unit, integration, and plugin acceptance tests
        run: cargo test --workspace --locked

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    needs: policy
    env:
      # Minimum line coverage (%). Raise it as coverage grows; never lower it
      # without recording the reason in the commit message. 70.9% measured on
      # master (66f8afe, 2026-10-11); the margin absorbs small refactors.
      COVERAGE_MIN_LINES: "68"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install build deps
        uses: ./.github/actions/build-deps

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage instrumentation
        run: cargo llvm-cov --all-targets --locked --no-report

      - name: Write lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Publish summary and enforce minimum line coverage
        shell: bash
        run: |
          summary=$(cargo llvm-cov report --summary-only)
          {
            echo "## Code coverage"
            echo
            echo "Minimum line coverage: ${COVERAGE_MIN_LINES}%"
            echo
            echo '```'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only --fail-under-lines "${COVERAGE_MIN_LINES}"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-report
          path: lcov.info
