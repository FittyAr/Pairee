name: Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # release.yml runs every check before building a release.
  workflow_call:

permissions:
  contents: read

# Align JS actions with Node 24 (same policy as release.yml).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  policy:
    name: Policy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Forbid crate-level clippy::all allow
        shell: bash
        run: |
          if grep -n '#!\[allow(clippy::all)\]' src/main.rs; then
            echo "::error::src/main.rs must not use #![allow(clippy::all)] — fix lints instead"
            exit 1
          fi
          echo "Policy OK: no crate-level clippy::all allow"

      - name: EN/ES translation key parity
        shell: bash
        run: python scripts/check_translations.py

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Prebuilt latest cargo-deny: the Docker-based action pulled its image
      # from Docker Hub on every run and failed on its rate limits.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses, advisories, and crate sources
        run: cargo deny check

  typos:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check spelling (configured in _typos.toml)
        uses: crate-ci/typos@v1.50.2

  msrv:
    name: MSRV (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          version=$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error::rust-version is not declared in Cargo.toml"
            exit 1
          fi
          echo "MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Check all targets with the MSRV toolchain
        run: cargo check --workspace --all-targets --locked

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    needs: policy
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build documentation (warnings are errors)
        run: cargo doc --no-deps --locked

  test:
    name: Run tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install pkg-config

      - name: Run unit, integration, and plugin acceptance tests
        run: cargo test --workspace --locked

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    needs: policy
    env:
      # Minimum line coverage (%). Raise it as coverage grows; never lower it
      # without recording the reason in the commit message.
      COVERAGE_MIN_LINES: "39"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage instrumentation
        run: cargo llvm-cov --all-targets --locked --no-report

      - name: Write lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Publish summary and enforce minimum line coverage
        shell: bash
        run: |
          summary=$(cargo llvm-cov report --summary-only)
          {
            echo "## Code coverage"
            echo
            echo "Minimum line coverage: ${COVERAGE_MIN_LINES}%"
            echo
            echo '```'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only --fail-under-lines "${COVERAGE_MIN_LINES}"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info
