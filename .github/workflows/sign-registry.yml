name: Sign registry

# Signs registry/index.toml, registry/blocklist.toml and every plugin
# manifest.toml with the Pairee release key (minisign) after each push to
# this branch, and commits the .minisig files that changed. Pairee checks
# them before installing anything (docs/technical/plugin-registry-spec.md,
# section 6.1, on master).
#
# The signing itself is master's .github/scripts/sign.sh (the same script
# the releases use), checked out next to the registry with the updater
# source that holds the public key: every signature is verified against
# the key embedded in Pairee before it is committed.
#
# No loop: the commit is pushed with GITHUB_TOKEN (whose pushes start no
# workflow), says [skip ci], and only adds .minisig files, which the paths
# filter ignores. Signing is deterministic, so a rerun on unchanged files
# commits nothing.
#
# Anything pushed here gets signed with the release key: keep the branch
# protected (pull requests with review), and add required reviewers to the
# `registry-signing` environment to approve each signing run.
on:
  push:
    branches: [plugin-registry]
    paths:
      - 'registry/index.toml'
      - 'registry/blocklist.toml'
      - 'registry/plugins/**/manifest.toml'
  workflow_dispatch:

permissions:
  contents: read

# One signing run at a time; a newer push waits instead of racing the commit.
concurrency:
  group: sign-registry
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  sign:
    name: Sign index, blocklist and manifests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/plugin-registry'
    timeout-minutes: 10
    environment: registry-signing
    permissions:
      contents: write
    steps:
      - name: Checkout the registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the signing script and the public key (master)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: .pairee
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/sign.sh
            src/update/signature.rs
          sparse-checkout-cone-mode: false

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign

      - name: Sign
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          SIGN_DIR: registry
          SIGNATURE_RS: ${{ github.workspace }}/.pairee/src/update/signature.rs
        run: |
          set -euo pipefail
          # Paths relative to registry/: the trusted comment must name them so.
          files=(index.toml blocklist.toml)
          while IFS= read -r manifest; do
            files+=("$manifest")
          done < <(cd registry && find plugins -name manifest.toml | LC_ALL=C sort)
          bash .pairee/.github/scripts/sign.sh "${files[@]}"

      - name: Commit the signatures
        shell: bash
        run: |
          set -euo pipefail
          git add -- 'registry/*.minisig' 'registry/**/*.minisig'
          if git diff --cached --quiet; then
            echo "Signatures are up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "registry: sign index, blocklist and manifests [skip ci]"
          git push origin HEAD:plugin-registry
