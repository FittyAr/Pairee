name: Fuzz

# cargo-fuzz targets in fuzz/ (parsers of untrusted input: archives, keymaps,
# command line, ANSI output, multi-rename patterns, release checksums, user
# syntax highlighting definitions).
# A short smoke run per target on pushes and pull requests that touch the
# code, a longer one every week. Not part of the release gate.
on:
  push:
    branches: [master, main]
    paths: ['src/**', 'fuzz/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/fuzz.yml']
  pull_request:
    branches: [master, main]
    paths: ['src/**', 'fuzz/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/fuzz.yml']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a running smoke run; the weekly long run (same
# ref, other event) is never cancelled by one.
concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Third-party actions are pinned by commit SHA (the comment names the
# release); update the SHA and the comment together.
jobs:
  fuzz:
    name: cargo fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Seconds of fuzzing per target.
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly toolchain (libFuzzer and sanitizers)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly

      - name: Install build deps
        uses: ./.github/actions/build-deps

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
          key: fuzz

      # The prebuilt cargo-fuzz is a musl binary and defaults to its own
      # target, where the sanitizers cannot link: build for the host.
      - name: Pick the host target
        shell: bash
        run: |
          echo "FUZZ_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"

      - name: Build fuzz targets
        run: cargo fuzz build --target "$FUZZ_TARGET"

      # Every target runs even when an earlier one finds a crash; the job
      # fails at the end and the crashing inputs are uploaded.
      - name: Fuzz every target
        shell: bash
        run: |
          failed=()
          for target in $(cargo fuzz list); do
            echo "::group::${target} (${FUZZ_SECONDS}s)"
            if ! cargo fuzz run --target "$FUZZ_TARGET" "$target" -- \
              -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048 -timeout=20; then
              failed+=("$target")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::fuzz targets failed: ${failed[*]}"
            exit 1
          fi

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
