name: Publish to WinGet

# Called by release.yml once a release is public; run it by hand to retry a
# submission. Opens a pull request on microsoft/winget-pkgs from the
# WINGET_TOKEN owner's fork, so FittyAr.Pairee must already exist there.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Submit to microsoft/winget-pkgs
    runs-on: windows-latest
    steps:
      - name: Require the WinGet token
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::error::Repository secret WINGET_TOKEN is not set (classic PAT with public_repo scope)."
            exit 1
          fi

      - name: Submit package to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: FittyAr.Pairee
          release-tag: ${{ inputs.tag }}
          installers-regex: '^pairee-setup-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
