name: Release

# Started by the tag that `cargo xtask release` pushes (or by hand from the
# Actions tab). Flow:
#   check + release notes -> build & smoke-test every target -> signed draft
#   release -> approval of the `release` environment -> publish -> WinGet.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default; only the jobs that create or publish the release
# get `contents: write`.
permissions:
  contents: read

# One release run per ref at a time; a running release is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Force all JavaScript actions to run on Node.js 24. GitHub will also force
# this for actions that target Node 20, but pinning it here makes the intent
# explicit and silences the deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Third-party actions are pinned by commit SHA (the comment names the
# release); update the SHA and the comment together. Packaging, checksums
# and signing live in .github/scripts/.
jobs:
  # Nothing is built from a commit that fails the Check workflow.
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.extract.outputs.body }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      # The Cargo.toml version names the packages; a tag must match it. A
      # manual run on a branch is a dry run: it builds and smoke-tests
      # everything but publishes nothing.
      - name: Version
        id: version
        shell: bash
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "pairee") | .version')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${crate}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the Cargo.toml version ${crate}"
            exit 1
          fi
          echo "version=v${crate}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: extract
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! BODY=$(cargo xtask changelog "${VERSION}"); then
            echo "::warning::No changelog section for ${VERSION}"
            BODY="See the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/master/docs/CHANGELOG.md)."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [check, release-notes]
    # A hung step must not hold a runner for the 6-hour default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # runnable: the runner executes this target, so the packaged
          # binaries are run by the smoke test.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            runnable: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            runnable: true
            apt-extra: musl-tools rpm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            runnable: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
            runnable: true
          - target: aarch64-apple-darwin
            os: macos-latest
            runnable: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install build deps
        uses: ./.github/actions/build-deps
        with:
          apt-extra: ${{ matrix.apt-extra }}

      # Latest releases, as prebuilt binaries (no compiling the tools).
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cross

      - name: Install cargo-deb and cargo-generate-rpm
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CROSS: ${{ matrix.cross || false }}
        run: |
          if [ "$CROSS" = "true" ]; then
            cross build --release --target "$TARGET"
          else
            cargo build --release --target "$TARGET"
          fi

      - name: Package release assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-notes.outputs.version }}
          # Unset: package-msix.ps1 uses the Pairee Store identity.
          STORE_PACKAGE_NAME: ${{ secrets.STORE_PACKAGE_NAME || vars.STORE_PACKAGE_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER || vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME || vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: bash .github/scripts/package.sh

      - name: Smoke-test packages
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-notes.outputs.version }}
          RUNNABLE: ${{ matrix.runnable || false }}
        run: bash .github/scripts/verify-dist.sh

      - name: Generate SHA-256 checksums
        shell: bash
        run: bash .github/scripts/checksums.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  # Signed draft release: assets can be checked on GitHub before the
  # `publish` job makes it public.
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [release-notes, build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository (signing script and embedded public key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts/sign.sh
            src/update/signature.rs
          sparse-checkout-cone-mode: false

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      # Sign every asset with the Pairee release key (minisign); the
      # signatures are checked against the key in src/update/signature.rs.
      - name: Sign release assets (minisign)
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          bash .github/scripts/sign.sh

      # A re-run replaces an earlier draft of the same tag; a published
      # release is never touched (`gh release create` fails on it).
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ needs.release-notes.outputs.body }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2> /dev/null)" = "true" ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # Waits for a reviewer to approve the `release` environment (Settings ->
  # Environments), then makes the draft public.
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: draft
    permissions:
      contents: write
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # Called directly: a release published with GITHUB_TOKEN does not start
  # other workflows through the `release: published` event.
  winget:
    name: WinGet
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
