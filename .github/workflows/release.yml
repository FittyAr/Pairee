name: Release

# Started by the tag that `cargo xtask release` pushes (or by hand from the
# Actions tab). Flow:
#   check + release notes -> build & smoke-test every target -> signed draft
#   release -> approval of the `release` environment -> publish -> WinGet.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Force all JavaScript actions to run on Node.js 24. GitHub will also force
# this for actions that target Node 20, but pinning it here makes the intent
# explicit and silences the deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Nothing is built from a commit that fails the Check workflow.
  check:
    name: Check
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.extract.outputs.body }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The Cargo.toml version names the packages; a tag must match it. A
      # manual run on a branch is a dry run: it builds and smoke-tests
      # everything but publishes nothing.
      - name: Version
        id: version
        shell: bash
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "pairee") | .version')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${crate}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the Cargo.toml version ${crate}"
            exit 1
          fi
          echo "version=v${crate}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: extract
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! BODY=$(cargo xtask changelog "${VERSION}"); then
            echo "::warning::No changelog section for ${VERSION}"
            BODY="See the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/master/docs/CHANGELOG.md)."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [check, release-notes]
    # A hung step must not hold a runner for the 6-hour default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # runnable: the runner executes this target, so the packaged
          # binaries are run by the smoke test.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            runnable: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            runnable: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            runnable: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
            runnable: true
          - target: aarch64-apple-darwin
            os: macos-latest
            runnable: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux packaging tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools rpm

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install pkg-config

      # Latest releases, as prebuilt binaries (no compiling the tools).
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install cargo-deb and cargo-generate-rpm
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package release assets
        shell: bash
        env:
          VERSION: ${{ needs.release-notes.outputs.version }}
          STORE_PACKAGE_NAME: ${{ secrets.STORE_PACKAGE_NAME || vars.STORE_PACKAGE_NAME || '30176FittyDev.Pairee' }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER || vars.STORE_PUBLISHER || 'CN=EDC5BDED-A726-42CD-B98E-5657B88D9832' }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME || vars.STORE_PUBLISHER_DISPLAY_NAME || 'FittyAr' }}
        run: |
          VERSION_NUM="${VERSION#v}"
          PKG_NAME="pairee-${VERSION}-${{ matrix.target }}"
          mkdir -p "$PKG_NAME"
          mkdir -p dist

          # Copy resources
          cp -r lang help README.md LICENSE "$PKG_NAME/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/pairee.exe" "$PKG_NAME/"
            powershell -Command "Compress-Archive -Path '$PKG_NAME' -DestinationPath '${PKG_NAME}.zip' -Force"
            mv "${PKG_NAME}.zip" dist/

            # Compile Inno Setup installer
            if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then
              MSYS_NO_PATHCONV=1 "C:\\Program Files (x86)\\Inno Setup 6\\iscc.exe" /DAppVersion="$VERSION_NUM" /DSourceDir="target\\aarch64-pc-windows-msvc\\release" /O"target\\release" /F"pairee-setup-${VERSION_NUM}-arm64" installer.iss
              mv "target/release/pairee-setup-${VERSION_NUM}-arm64.exe" dist/
            else
              MSYS_NO_PATHCONV=1 "C:\\Program Files (x86)\\Inno Setup 6\\iscc.exe" /DAppVersion="$VERSION_NUM" /DSourceDir="target\\x86_64-pc-windows-msvc\\release" /O"target\\release" /F"pairee-setup-${VERSION_NUM}-x64" installer.iss
              mv "target/release/pairee-setup-${VERSION_NUM}-x64.exe" dist/
            fi

            # Package MSIX for Windows Store / Sideloading
            MSIX_STAGING="target/msix_staging_${{ matrix.target }}"
            mkdir -p "$MSIX_STAGING"
            cp "target/${{ matrix.target }}/release/pairee.exe" "$MSIX_STAGING/"
            cp -r lang help manifests/msix/Assets "$MSIX_STAGING/"
            cp manifests/msix/AppxManifest.xml "$MSIX_STAGING/"

            ARCH="x64"
            if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then
              ARCH="arm64"
            fi

            powershell -Command "
              \$manifestPath = (Resolve-Path '$MSIX_STAGING/AppxManifest.xml').Path;
              \$manifest = [System.IO.File]::ReadAllText(\$manifestPath);
              \$manifest = \$manifest -replace 'TEMPLATE_PACKAGE_IDENTITY_NAME', \$env:STORE_PACKAGE_NAME;
              \$manifest = \$manifest -replace 'TEMPLATE_PACKAGE_IDENTITY_PUBLISHER', \$env:STORE_PUBLISHER;
              \$manifest = \$manifest -replace 'TEMPLATE_PUBLISHER_DISPLAY_NAME', \$env:STORE_PUBLISHER_DISPLAY_NAME;
              \$manifest = \$manifest -creplace 'Version=\"[^\"]+\"', 'Version=\"$VERSION_NUM.0\"';
              \$manifest = \$manifest -creplace 'ProcessorArchitecture=\"[^\"]+\"', 'ProcessorArchitecture=\"$ARCH\"';
              \$utf8NoBom = New-Object System.Text.UTF8Encoding(\$false);
              [System.IO.File]::WriteAllText(\$manifestPath, \$manifest, \$utf8NoBom);
              \$makeappx = (Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter 'makeappx.exe' -Recurse | Where-Object { \$_.FullName -match 'x64' } | Select-Object -First 1).FullName;
              if (-not \$makeappx) { \$makeappx = 'makeappx.exe' };
              & \$makeappx pack /d '$MSIX_STAGING' /p 'dist/pairee-${VERSION_NUM}-${ARCH}.msix';
            "
          else
            cp "target/${{ matrix.target }}/release/pairee" "$PKG_NAME/"
            tar -czf "${PKG_NAME}.tar.gz" "$PKG_NAME"
            mv "${PKG_NAME}.tar.gz" dist/

            if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
              cargo deb --target x86_64-unknown-linux-musl --no-build
              mv target/x86_64-unknown-linux-musl/debian/*.deb dist/

              cargo generate-rpm --target x86_64-unknown-linux-musl
              mv target/x86_64-unknown-linux-musl/generate-rpm/*.rpm dist/
            fi
          fi

      - name: Smoke-test packages
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-notes.outputs.version }}
          RUNNABLE: ${{ matrix.runnable || false }}
        run: bash .github/scripts/verify-dist.sh

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          for f in *; do
            if [ -f "$f" ]; then
              if command -v sha256sum > /dev/null; then
                sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
              else
                shasum -a 256 "$f" | awk '{print $1}' > "${f}.sha256"
              fi
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  # Signed draft release: assets can be checked on GitHub before the
  # `publish` job makes it public.
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [release-notes, build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository (for the embedded public key)
        uses: actions/checkout@v7
        with:
          sparse-checkout: src/update/signature.rs
          sparse-checkout-cone-mode: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      # Sign every asset with the Pairee release key (minisign). The updater
      # and installers require `<asset>.minisig`; publishing fails without
      # the secret. The trusted comment names the file so a signature cannot
      # be reused for another asset.
      - name: Sign release assets (minisign)
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::Repository secret MINISIGN_SECRET_KEY is not set; refusing to publish unsigned assets."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          umask 077
          KEY_FILE="$RUNNER_TEMP/pairee-release.key"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY_FILE"
          cd dist
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256|*.minisig) continue ;; esac
            COMMENT="file:${f} version:${GITHUB_REF_NAME}"
            if [ -n "${MINISIGN_PASSWORD:-}" ]; then
              printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$KEY_FILE" -m "$f" -t "$COMMENT"
            else
              minisign -S -s "$KEY_FILE" -m "$f" -t "$COMMENT" < /dev/null
            fi
            test -s "${f}.minisig"
          done
          # The secret must match the public key embedded in the binary.
          PUBKEY=$(grep -oP 'RELEASE_PUBLIC_KEY: &str = "\K[^"]+' "$GITHUB_WORKSPACE/src/update/signature.rs")
          for f in *.minisig; do
            minisign -V -q -P "$PUBKEY" -m "${f%.minisig}"
          done
          ls -l

      # A re-run replaces an earlier draft of the same tag; a published
      # release is never touched (`gh release create` fails on it).
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ needs.release-notes.outputs.body }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2> /dev/null)" = "true" ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # Waits for a reviewer to approve the `release` environment (Settings ->
  # Environments), then makes the draft public.
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: draft
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # Called directly: a release published with GITHUB_TOKEN does not start
  # other workflows through the `release: published` event.
  winget:
    name: WinGet
    needs: publish
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
