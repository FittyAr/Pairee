name = "recent-files.pairee"
version = "1.0.0"
description = "Tracks recently visited files and directories in the background and lets you jump back to them with a single keypress."
author = "FittyAr"
license = "MIT"
homepage = "https://github.com/FittyAr/Pairee"
tags = ["command", "hook", "navigation", "history", "recent"]

# Language support
default_language = "en"
languages = ["en", "es"]

# Required Pairee version
min_pairee = "0.7.0"

# Only uses the Pairee FS API to persist state - no external tools,
# no spawning - so it can run untrusted.
requires_trust = false

# Lifecycle events the plugin subscribes to during setup()
hooks = ["on_cd", "on_hover"]

# Plugin type: hook + command. We track via setup() and expose a
# pick-list via entry().
type = "mixed"

# User-tunable settings (visible in the TUI options dialog)
[settings_schema]
max_entries   = { type = "integer", default = 50,   description = "Maximum number of recent entries to keep on disk." }
record_dirs   = { type = "bool",    default = true,  description = "Record directory changes (cd), in addition to file selections." }
record_hover  = { type = "bool",    default = false, description = "Also record every cursor hover (can be noisy; off by default)." }
persist_path  = { type = "string",  default = "",    description = "Override path to the JSON history file. Empty = use the Pairee default." }

# Default keybinding: Ctrl+R opens the recent-files picker
[keybindings]
"ctrl+r" = "entry"

