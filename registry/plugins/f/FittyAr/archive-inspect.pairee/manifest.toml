name = "archive-inspect.pairee"
version = "1.0.0"
description = "Preview the contents of ZIP, TAR.GZ and 7Z archives in the file panel without extracting them."
author = "FittyAr"
license = "MIT"
homepage = "https://github.com/FittyAr/Pairee"
tags = ["previewer", "archive", "zip", "tar", "7z"]

# Language support
default_language = "en"
languages = ["en", "es"]

# Required Pairee version
min_pairee = "0.7.0"

# Spawns external tools (unzip, tar, 7z) to list contents
requires_trust = true

# Subscribed events (informational; drives the resolver)
hooks = ["preview"]

# Plugin type: implements peek()/seek() for the preview pane
type = "previewer"

# Settings users can tweak in the TUI options panel
[settings_schema]
max_entries = { type = "integer", default = 500, description = "Maximum number of archive entries to show (larger lists are truncated)." }
show_hidden = { type = "bool",    default = false, description = "Include dotfiles / hidden entries inside archives." }
sort_by     = { type = "string",  default = "path", description = "Default sort column: path, size or date." }
extra_args  = { type = "string",  default = "",     description = "Extra arguments appended to the listing tool." }

# Default keybindings (merged at load time)
[keybindings]
"F2" = "entry"        # F2 on a hovered archive -> show a quick summary dialog

# Auto-registered previewer mappings (mime / extension)
[previewers]
mime   = ["application/zip", "application/x-tar", "application/x-7z-compressed", "application/gzip"]
ext    = ["zip", "tar", "tar.gz", "tgz", "7z"]
plugin = "archive-inspect.pairee"

