name = "disk-usage"
version = "1.2.0"
description = "Show a sorted breakdown of disk usage in the active panel. Find what is eating your space."
author = "FittyAr"
license = "MIT"
homepage = "https://github.com/FittyAr/Pairee"
tags = ["command", "disk-usage", "du", "analysis", "cleanup"]

# Plugin type: implements entry() to launch the analysis
type = "command"

# Lua API 1.3.0 and `[[commands]]`
min_pairee = "0.11.0"

# The plugin spawns the `du` binary on Linux / macOS to compute sizes, so it
# must be trusted. On Windows it scans natively via `pairee.fs` (no process).
requires_trust = true

# Language support
default_language = "en"
languages = ["en", "es"]

icon = "icon.png"
screenshots = ["screenshots/report.png"]

# Settings users can tweak in the Plugin Manager (`c` or Enter)
[settings_schema]
depth          = { type = "integer", default = 2,     description = "How deep du lists nested folders (1 = only the top-level entries)." }
top_n          = { type = "integer", default = 20,    description = "How many of the largest entries to display in the result." }
include_hidden = { type = "bool",    default = false, description = "Include hidden files and dot-directories in the report." }
extra_args     = { type = "string",  default = "",    description = "Extra arguments appended to the du invocation (Linux / macOS)." }

# Disk-usage report of the active folder (keymap id: plugin.disk-usage.report)
[[commands]]
id = "report"
title = "Disk usage report"

[commands.keys]
default = "Ctrl+Alt+e d"
neovim = "<leader>pd"
yazi = "Alt+p d"

# Programs this plugin may spawn when Secure Mode is on (bare names resolved
# through PATH). Anything not listed here is refused.
[permissions]
commands = ["du"]

