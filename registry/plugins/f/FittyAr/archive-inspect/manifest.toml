name = "archive-inspect"
version = "1.1.0"
description = "Preview the contents of ZIP, TAR.GZ and 7Z archives in the file panel without extracting them."
author = "FittyAr"
license = "MIT"
homepage = "https://github.com/FittyAr/Pairee"
tags = ["previewer", "archive", "zip", "tar", "7z"]

# Plugin type: implements peek() for the preview pane, plus one command
type = "mixed"

# Lua API 1.3.0 and `[[commands]]`
min_pairee = "0.11.0"

# Spawns external tools (unzip, tar, 7z) to list contents
requires_trust = true

# Language support
default_language = "en"
languages = ["en", "es"]

icon = "icon.png"
screenshots = ["screenshots/preview-pane.png"]

# Settings users can tweak in the Plugin Manager (`c` or Enter)
[settings_schema]
max_entries = { type = "integer", default = 500, description = "Maximum number of archive entries to show (larger lists are truncated)." }
show_hidden = { type = "bool",    default = false, description = "Include dotfiles / hidden entries inside archives." }
sort_by     = { type = "string",  default = "path", description = "Default sort column: path, size or date." }
extra_args  = { type = "string",  default = "",     description = "Extra arguments appended to the listing tool." }

# Summary of the hovered archive (keymap id: plugin.archive-inspect.summary)
[[commands]]
id = "summary"
title = "Archive summary"

[commands.keys]
default = "Ctrl+Alt+e a"
neovim = "<leader>pa"
yazi = "Alt+p a"

# Programs this plugin may spawn when Secure Mode is on (bare names resolved
# through PATH). Anything not listed here is refused.
[permissions]
commands = ["unzip", "tar", "7z"]

