name = "recent-files"
version = "1.1.0"
description = "Tracks recently visited files and directories in the background and lets you jump back to them with a single keypress."
author = "FittyAr"
license = "MIT"
homepage = "https://github.com/FittyAr/Pairee"
tags = ["command", "hook", "navigation", "history", "recent"]

# Plugin type: hook (setup subscriptions) + command (the picker)
type = "mixed"

# Lua API 1.3.0, `[[commands]]` and `pairee.state`
min_pairee = "0.11.0"

# Only uses pairee.state and panel events - no processes - so it runs
# untrusted.
requires_trust = false

# Language support
default_language = "en"
languages = ["en", "es"]

icon = "icon.png"
screenshots = ["screenshots/picker.png"]

# Settings users can tweak in the Plugin Manager (`c` or Enter)
[settings_schema]
max_entries  = { type = "integer", default = 50,    description = "Maximum number of recent entries to keep." }
record_dirs  = { type = "bool",    default = true,  description = "Record folder changes (cd)." }
record_hover = { type = "bool",    default = false, description = "Also record every file under the cursor (can be noisy; off by default)." }

# Recent-files picker (keymap id: plugin.recent-files.pick)
[[commands]]
id = "pick"
title = "Recent files"

[commands.keys]
default = "Ctrl+Alt+e r"
neovim = "<leader>pr"
yazi = "Alt+p r"

