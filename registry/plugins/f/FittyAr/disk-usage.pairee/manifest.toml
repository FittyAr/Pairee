name = "disk-usage.pairee"
version = "1.1.0"
description = "Show a sorted breakdown of disk usage in the active panel. Finds what's eating your space."
author = "FittyAr"
license = "MIT"
homepage = "https://github.com/FittyAr/Pairee"
tags = ["command", "disk-usage", "du", "analysis", "cleanup"]

# Language support
default_language = "en"
languages = ["en", "es"]

# Required Pairee version
min_pairee = "0.7.0"

# The plugin spawns the `du` binary on Linux / macOS to compute sizes, so it
# must be trusted. On Windows it scans natively via `pairee.fs` (no shell).
requires_trust = true

# Subscribed events (informational)
hooks = ["ctrl-d"]

# Plugin type: implements entry() to launch the analysis
type = "command"

# User-tunable settings (visible in the TUI options dialog)
[settings_schema]
depth          = { type = "integer", default = 2,    description = "How deep to recurse when measuring each top-level entry (1 = no recursion)." }
top_n          = { type = "integer", default = 20,   description = "How many of the largest entries to display in the result." }
include_hidden = { type = "bool",    default = false, description = "Include hidden files and dot-directories in the calculation." }
extra_args     = { type = "string",  default = "",    description = "Extra arguments appended to the du invocation." }

# Default keybinding: Ctrl+D opens the disk-usage report for the active cwd
[keybindings]
"ctrl+d" = "entry"

# Programs this plugin may spawn when Secure Mode is on (bare names resolved
# through PATH). Anything not listed here is refused.
[permissions]
commands = ["du"]

