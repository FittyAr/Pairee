plugin_dev_desc_active = "Selecciona o desselecciona el plugin de desarrollo activo. Si un plugin está activo, las acciones de desarrollo (verificar, empaquetar, instalar, enviar) se aplicarán únicamente a él, y la inicialización de nuevos plugins estará desactivada."
plugin_dev_desc_init = "Crea una nueva carpeta bajo el directorio de plugins del usuario con plantillas predefinidas:\n  - manifest.toml (Metadatos por defecto del autor/dependencias)\n  - main.lua (Punto de entrada de scripts y listeners de eventos)\n  - help/en.md (Plantillas de documentación del desarrollador)"
plugin_dev_desc_init_disabled = "La inicialización de nuevos plugins está desactivada mientras haya otro seleccionado como activo."
plugin_dev_desc_install = "Copia el plugin de desarrollo activo al directorio de plugins locales para probarlo."
plugin_dev_desc_lint = "Realiza auditorías de verificación de cumplimiento sobre el plugin de desarrollo activo:\n  - Valida el formato y la sintaxis de los archivos Lua\n  - Inspecciona las configuraciones del manifiesto en busca de claves ausentes\n  - Audita las reglas de seguridad (asegura que no se utilicen módulos del sistema prohibidos)"
plugin_dev_desc_open_dev = "Mueve el panel activo a la carpeta del plugin de desarrollo actualmente seleccionado (o a la raíz de plugins de desarrollo si ninguno está seleccionado). Útil para editar manifest.toml, main.lua, capturas, etc."
plugin_dev_desc_open_pack = "Mueve el panel activo a la carpeta del plugin empaquetado dentro del clon local del registro (cache_dir/temp_registry/registry/plugins/...). Útil para inspeccionar el manifiesto SHA-256, el índice generado y verificar el paquete antes de enviarlo."
plugin_dev_desc_open_subm = "Mueve el panel activo al clon local del registro (cache_dir/temp_registry) donde se prepara el commit y el push para el envío."
plugin_dev_desc_package = "Empaqueta los archivos del plugin de desarrollo activo en un archivo de distribución listo:\n  - Reúne todos los archivos y manuales locales\n  - Los comprime en un único archivo zip de lanzamiento\n  - Calcula el bloque de suma de comprobación de integridad SHA-256"
plugin_dev_desc_submit = "Publica el plugin empaquetado activo directamente en el índice del registro oficial:\n  - Valida la firma del paquete y las claves de metadatos\n  - Realiza un fork y envía un pull request al índice del repositorio central"
