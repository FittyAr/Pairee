# Project-level Clippy policy. Prefer fixing lints over allowing them.
# God-file growth is discouraged; see docs/IMPROVEMENT_PLAN.md and .agents/AGENTS.md.
#
# Functions with more than seven arguments take a parameter struct instead.
cognitive-complexity-threshold = 40
too-many-arguments-threshold = 7
type-complexity-threshold = 250
allow-expect-in-tests = true
allow-unwrap-in-tests = true
# Functions longer than this are split into handlers/helpers (`too_many_lines`
# is enabled in Cargo.toml `[lints.clippy]`).
too-many-lines-threshold = 100
