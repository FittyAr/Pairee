# Pairee Keybinding Preset: Norton Commander / Far Manager
#
# This file defines the complete key-to-action mapping for the classic
# Norton Commander / Far Manager layout.
#
# Keys are specified as human-readable strings, for example:
#   "F5", "Ctrl+c", "Alt+F7", "Shift+F9", "Ctrl+Alt+1"
#
# Action names match the snake_case variants of the Action enum.
# Refer to the Pairee documentation for a full list of available actions.

extends = "base"

[panels]

# ── Navigation ────────────────────────────────────────────────────────────────
move_up               = "Up"
move_down             = "Down"
page_up               = "PageUp"
page_down             = "PageDown"
go_to_top             = "Home"
go_to_bottom          = "End"
execute               = "Enter"
go_parent             = "Backspace, Ctrl+PageUp"
tree_view             = "Alt+F10"

# ── Selection ─────────────────────────────────────────────────────────────────
select_item           = "Insert, Space"

# ── Files ─────────────────────────────────────────────────────────────────────
view                  = "F3"
view_alt              = "Alt+F3"
edit                  = "F4"
copy                  = "F5"
move                  = "F6"
rename                = "F7"
delete                = "F8"
wipe_file             = "Alt+Delete"
create_link           = "Alt+F6"
print_file            = "Alt+F5"

# ── Archives ──────────────────────────────────────────────────────────────────
compress_files        = "Shift+F1, Alt+c"
extract_archive       = "Shift+F2, Alt+e"

# ── Search & history ──────────────────────────────────────────────────────────
find_file             = "Alt+F7"
command_history       = "Alt+F8"

# ── View ──────────────────────────────────────────────────────────────────────
toggle_hidden         = "Ctrl+h"
toggle_long_names     = "Ctrl+n"
refresh               = "Ctrl+r"
video_mode            = "Alt+F9"

# ── Panels ────────────────────────────────────────────────────────────────────
swap_panels           = "Ctrl+u"
toggle_both_panels    = "Ctrl+o"
quick_view            = "Ctrl+q"
toggle_transfer_panel = "Ctrl+t"

# ── Tabs & screens ────────────────────────────────────────────────────────────
new_tab               = "Alt+t"

# ── Tools ─────────────────────────────────────────────────────────────────────
user_menu             = "F2"

# ── System ────────────────────────────────────────────────────────────────────
context_menu          = "Menu, Alt+m"
save_setup            = "Shift+F9"
quit                  = "F10"
