# Pairee keymap: base layer
#
# What every built-in preset shares: the keys of the numeric keypad and of
# the F-key row that all dual-panel file managers agree on, Far's Ctrl+F3…F12
# sorting and Ctrl+1…9 views, tabs, screens, and the editor, viewer and list
# keys. Presets inherit it with `extends = "base"` and only list what they
# change. Naming an action in a preset replaces the chords it inherited, and
# `action = ""` unbinds it. This layer is not selectable on its own.
#
# Chords: "F5", "Ctrl+c", "Alt+Shift+PageUp", "Ctrl+K" (an uppercase letter
# means Shift), sequences "g g", several chords "k, Up". `Gray+` / `Gray-` /
# `Gray*` are the keypad keys; `Comma` is the `,` key.

[panels]

# ── Navigation ────────────────────────────────────────────────────────────────
move_up      = "Up"
move_down    = "Down"
page_up      = "PageUp"
page_down    = "PageDown"
go_to_top    = "Home"
go_to_bottom = "End"
execute      = "Enter"
go_parent    = "Backspace"

# ── Selection (numeric keypad, as in Far and Total Commander) ─────────────────
select_group     = "Gray+"
unselect_group   = "Gray-"
invert_selection = "Gray*"

# ── Files: the F-key row every dual-panel manager shares ──────────────────────
view   = "F3"
edit   = "F4"
copy   = "F5"
move   = "F6"
mkdir  = "F7"
delete = "F8"

# ── View: Ctrl+1 … Ctrl+9 (Far) ───────────────────────────────────────────────
panel_view_brief        = "Ctrl+1"
panel_view_medium       = "Ctrl+2"
panel_view_full         = "Ctrl+3"
panel_view_wide         = "Ctrl+4"
panel_view_detailed     = "Ctrl+5"
panel_view_descriptions = "Ctrl+6"
panel_view_file_owners  = "Ctrl+7"
panel_view_file_links   = "Ctrl+8"
panel_view_alt_full     = "Ctrl+9"

# ── Sort: Ctrl+F3 … Ctrl+F12 (Far) ────────────────────────────────────────────
sort_by_name          = "Ctrl+F3"
sort_by_extension     = "Ctrl+F4"
sort_by_write_time    = "Ctrl+F5"
sort_by_size          = "Ctrl+F6"
sort_unsorted         = "Ctrl+F7"
sort_by_creation_time = "Ctrl+F8"
sort_by_access_time   = "Ctrl+F9"
sort_by_description   = "Ctrl+F10"
sort_by_owner         = "Ctrl+F11"
sort_modes            = "Ctrl+F12"

# ── Panels ────────────────────────────────────────────────────────────────────
change_panel = "Tab"

# ── Tabs & screens ────────────────────────────────────────────────────────────
next_tab       = "Alt+PageDown"
prev_tab       = "Alt+PageUp"
move_tab_left  = "Alt+Shift+PageUp"
move_tab_right = "Alt+Shift+PageDown"
screens_list   = "F12"
next_screen    = "Ctrl+Tab"
prev_screen    = "Ctrl+Shift+Tab"
go_to_tab_1    = "Alt+1"
go_to_tab_2    = "Alt+2"
go_to_tab_3    = "Alt+3"
go_to_tab_4    = "Alt+4"
go_to_tab_5    = "Alt+5"
go_to_tab_6    = "Alt+6"
go_to_tab_7    = "Alt+7"
go_to_tab_8    = "Alt+8"
go_to_tab_9    = "Alt+9"

# ── Folder shortcuts (set them in Commands → Folder shortcuts) ───────────────
go_folder_shortcut_1 = "Ctrl+Alt+1"
go_folder_shortcut_2 = "Ctrl+Alt+2"
go_folder_shortcut_3 = "Ctrl+Alt+3"
go_folder_shortcut_4 = "Ctrl+Alt+4"
go_folder_shortcut_5 = "Ctrl+Alt+5"
go_folder_shortcut_6 = "Ctrl+Alt+6"
go_folder_shortcut_7 = "Ctrl+Alt+7"
go_folder_shortcut_8 = "Ctrl+Alt+8"
go_folder_shortcut_9 = "Ctrl+Alt+9"

# ── System ────────────────────────────────────────────────────────────────────
# Ctrl+Shift+P needs the kitty keyboard protocol; Ctrl+Alt+p always arrives.
help            = "F1"
command_palette = "Ctrl+P, Ctrl+Alt+p"
which_key       = "Ctrl+K"
context_menu    = "Menu, Shift+F10"
unfocus         = "Esc"

# ══ Editor screen ═════════════════════════════════════════════════════════════
# Typing and cursor motions (arrows, Home/End, PgUp/PgDn; Shift selects,
# Alt+Shift selects a block) belong to the editor; these are its commands.
[editor]

save              = "F2, Ctrl+s"
save_as           = "Shift+F2"
reload            = "Ctrl+r, Ctrl+d"
search            = "F7, Ctrl+f"
search_next       = "F3, Shift+F7"
open_viewer       = "F4"
discard           = "F8"
quit              = "Esc, F10"
toggle_block_mode = "Ctrl+b"
undo              = "Ctrl+z"
redo              = "Ctrl+y, Ctrl+Z"
copy              = "Ctrl+c, Ctrl+C, Ctrl+Insert"
cut               = "Ctrl+x, Ctrl+X, Shift+Delete"
paste             = "Ctrl+v, Ctrl+V, Shift+Insert"
select_all        = "Ctrl+a, Ctrl+A"

# ══ Viewer screen ═════════════════════════════════════════════════════════════
[viewer]

line_up     = "Up"
line_down   = "Down"
page_up     = "PageUp"
page_down   = "PageDown"
top         = "Home"
bottom      = "End"
toggle_hex  = "F4"
edit        = "F6"
search      = "F7"
search_next = "F3"
encoding    = "F8"
quit        = "Esc, F10"

# ══ Lists in dialogs (menus, history, pickers...) ═════════════════════════════
# A key bound here acts as the arrow / Enter / Esc key it names, in every
# dialog that is not typing into a text field.
[list]

up        = "Up"
down      = "Down"
page_up   = "PageUp"
page_down = "PageDown"
first     = "Home"
last      = "End"
activate  = "Enter"
close     = "Esc"
