# Pairee Keybinding Preset: VS Code
#
# This file defines the key-to-action mapping for VS Code users.
# Modeled on VS Code's Explorer panel shortcuts and common editor conventions.
#
# Developers already familiar with VS Code can use Pairee without learning
# a new keyboard layout. Arrow-key navigation is universal; Ctrl+C/X/V
# style shortcuts handle file operations.
#
# Keys are specified as human-readable strings:
#   "Ctrl+c", "Delete", "F2", "Ctrl+N" (an uppercase letter means Shift:
#   Ctrl+N is Ctrl+Shift+n)

extends = "base"

[panels]

# ── Navigation ────────────────────────────────────────────────────────────────
move_up            = "Up"
move_down          = "Down"
page_up            = "PageUp"
page_down          = "PageDown"
go_to_top          = "Home"
go_to_bottom       = "End"
execute            = "Enter"
go_parent          = "Backspace, Ctrl+PageUp"
tree_view          = "Ctrl+T"

# ── Selection ─────────────────────────────────────────────────────────────────
select_item        = "Space, Insert"

# ── Files ─────────────────────────────────────────────────────────────────────
view               = "Ctrl+V, F3"
edit               = "Ctrl+e"
copy               = "Ctrl+c"
move               = "Ctrl+x"
rename             = "F2, F7"
mkdir              = "Ctrl+N"
delete             = "Delete, F8"
wipe_file          = "Shift+Delete"

# ── Archives ──────────────────────────────────────────────────────────────────
compress_files     = "Shift+F1"
extract_archive    = "Shift+F2"

# ── Search & history ──────────────────────────────────────────────────────────
find_file          = "Ctrl+F, Alt+F7"
command_history    = "Ctrl+H"

# ── View ──────────────────────────────────────────────────────────────────────
toggle_hidden      = "Ctrl+."
refresh            = "Ctrl+E"

# ── Panels ────────────────────────────────────────────────────────────────────
swap_panels        = "Ctrl+u"
toggle_both_panels = "Ctrl+b"
quick_view         = "Ctrl+Q"

# ── Tabs & screens ────────────────────────────────────────────────────────────
new_tab            = "Ctrl+t, Alt+t"

# ── Tools ─────────────────────────────────────────────────────────────────────
user_menu          = "Alt+u"
focus_cli          = "Ctrl+`"

# ── System ────────────────────────────────────────────────────────────────────
context_menu       = "Menu, Shift+F10"
save_setup         = "Ctrl+s"
system_settings    = "Ctrl+Comma"
quit               = "Ctrl+q, F10"
