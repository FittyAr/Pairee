# Pairee Keybinding Preset: Neovim
#
# This file defines the key-to-action mapping for Neovim-style navigation.
# Inspired by Oil.nvim, NvimTree, and standard Neovim motion conventions.
#
# Navigation uses h/j/k/l, with gg/G for top/bottom and Ctrl+d/u for half-pages.
# All F-key fallbacks are preserved so Norton Commander users switching presets
# can still reach every action via function keys.
#
# Keys are specified as human-readable strings:
#   "k", "Ctrl+d", "Alt+F7", "Shift+F9"

extends = "base"

[panels]

# ── Navigation ────────────────────────────────────────────────────────────────
move_up            = "k, Up"
move_down          = "j, Down"
page_up            = "Ctrl+u, PageUp"
page_down          = "Ctrl+d, PageDown"
go_to_top          = "g, Home"
go_to_bottom       = "G, End"
execute            = "l, Enter"
go_parent          = "h, Backspace, Ctrl+PageUp"
tree_view          = "Alt+F10"

# ── Selection ─────────────────────────────────────────────────────────────────
select_item        = "v, Insert, Space"

# ── Files ─────────────────────────────────────────────────────────────────────
view               = "o, F3"
view_alt           = "Alt+F3"
edit               = "e, F4"
copy               = "y, F5"
move               = "m, F6"
rename             = "r, F7"
mkdir              = "Ctrl+N"
delete             = "d, F8"
wipe_file          = "Alt+Delete"
create_link        = "Alt+F6"
print_file         = "Alt+F5"

# ── Archives ──────────────────────────────────────────────────────────────────
compress_files     = "Shift+F1"
extract_archive    = "Shift+F2"

# ── Search & history ──────────────────────────────────────────────────────────
find_file          = "/, Alt+F7"
command_history    = "Alt+F8"

# ── View ──────────────────────────────────────────────────────────────────────
toggle_hidden      = "Ctrl+h"
toggle_long_names  = "Ctrl+n"
refresh            = "Ctrl+r"
video_mode         = "Alt+F9"

# ── Panels ────────────────────────────────────────────────────────────────────
swap_panels        = "Ctrl+s"
toggle_both_panels = "Ctrl+o"
quick_view         = "Ctrl+q"

# ── Tabs & screens ────────────────────────────────────────────────────────────
new_tab            = "Ctrl+t, Alt+t"

# ── Tools ─────────────────────────────────────────────────────────────────────
user_menu          = "F2"
focus_cli          = ":"

# ── System ────────────────────────────────────────────────────────────────────
context_menu       = "Menu, Alt+m"
save_setup         = "Shift+F9"
quit               = "Ctrl+c, F10"
