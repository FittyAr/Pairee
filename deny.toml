# cargo-deny policy for Pairee (GPL-3.0-only).
# Keep this file short: only the checks we actually enforce.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained and pulled by image/rav1e for previews; no safe upgrade on image 0.25." },
    { id = "RUSTSEC-2017-0008", reason = "serial is unmaintained and pulled transitively by portable-pty 0.8.1; no direct usage." },
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "0BSD",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "NCSA",
    "bzip2-1.0.6",
]

[bans]
# Duplicate versions are common (windows-sys, thiserror, nom); warn, do not fail CI.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
