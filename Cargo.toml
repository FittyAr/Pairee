[package]
name = "pairee"
version = "0.10.0"
edition = "2024"
rust-version = "1.93"
description = "A sleek, modern dual-panel terminal file manager written in Rust"
default-run = "pairee"
license = "GPL-3.0-only"
repository = "https://github.com/FittyAr/Pairee"
readme = "README.md"

[dependencies]
# No termwiz/termina backends: default features would list them in the lock
# through weak `?/underline-color` features (never built, but audited).
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
directories = "6.0"
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"
chrono = "0.4"
zip = { version = "9.0.2", default-features = false, features = ["deflate", "time"] }
tar = "0.4.46"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
pulldown-cmark = "0.13"
# Only the formats the viewer and Quick View preview (no AVIF/rav1e, EXR, HDR...).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "https", "ssh"] }
futures-util = { version = "0.3", default-features = false, features = ["io"] }
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize", "async", "send"] }
percent-encoding = "2.3"
regex = "1.13"
blake3 = "1.5.4"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11.1"
# Private, randomly named temp dirs for update downloads (0700 on Unix).
tempfile = "3.27"
crc32fast = "1.4.2"
uuid = { version = "1.10.0", features = ["v4"] }
filetime = "0.2.25"
bytesize = "2.7"
# Professional key-binding parser/dispatcher (replaces ad-hoc string maps).
# Features: crossterm KeyEvent conversion, sequences, invalid-binding errors.
keybinds = { version = "0.2", features = ["crossterm", "serde"] }
unicode-width = "0.2"
tui-scrollbar = { version = "0.2.7", features = ["crossterm"] }
unicode-segmentation = "1.13.3"
shlex = "2.0"
ansi-to-tui = "8.0"
# Text only: no clipboard images (their image-data feature pulls in image codecs).
arboard = { version = "3.6.1", default-features = false }
sevenz-rust2 = "0.24"
# tar.bz2 / tar.xz: pure-Rust decoders (static musl builds keep working).
bzip2 = "0.6.1"
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "xz", "encoder"] }
nucleo-matcher = "0.3.1"
# Line diffs of two files (Compare files).
similar = "3.2.0"
# Unix openpty / Windows ConPTY for background Terminal (`command &`) and apply-command.
# Pin 0.8.1: 0.9.0 ConPTY INHERIT_CURSOR can hang simple commands (wezterm#6783).
portable-pty = "0.8.1"
trash = "5.2.9"
# Capability-based directory handles: plugin fs ops cannot escape the jail
# root even if a path component is swapped for a symlink after validation.
cap-std = "4.0"
minisign-verify = "0.3.0"
# Plugin `min_pairee` checks (pre-release aware).
semver = "1.0.28"
# Connection passwords in the OS keyring (Credential Manager, Keychain, Secret Service).
keyring = "4.2.0"
# Reads OpenSSH private key headers (is the key encrypted? then ask for its passphrase).
base64 = "0.23.1"
encoding_rs = "0.8"
chardetng = "1.0"
# Directory change notifications for panel auto-refresh (non-recursive watches).
notify = "8.2"
# Remote backends (src/fs/remote): FTP/FTPS over rustls (ring), S3 request
# signing (sans-IO, sent with reqwest), WebDAV PROPFIND parsing, URLs and
# the streamed request bodies of uploads.
suppaftp = { version = "12.2.0", features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
rusty-s3 = "0.10.2"
quick-xml = "0.42.0"
url = "2.5.8"
bytes = "1.12"
http-body = "1.1"
# Syntax highlighting of the editor and viewer: the embedded default syntax
# set with the pure-Rust fancy-regex engine (no Oniguruma C build, so static
# musl builds keep working); colors come from the Pairee theme.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[features]
# Exposes the parser entry points of `fuzz_api` to the cargo-fuzz crate in
# fuzz/ (not a public API).
fuzzing = []

# Syntax grammars compile hundreds of regexes on first use; unoptimized,
# that takes seconds per language in debug builds and tests.
[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.syntect]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
# Runs the built `pairee` binary in the CLI tests (tests/cli.rs).
assert_cmd = "2.2"
# In-process servers the remote backends run their Vfs contract tests
# against (src/fs/remote/tests): WebDAV, S3 (checks request signatures)
# and FTP, all serving temporary folders.
dav-server = { version = "0.11", default-features = false, features = ["localfs"] }
s3s = "0.14"
s3s-fs = "0.14"
libunftp = { version = "0.23", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
# Self-signed certificate of the FTPS test server, made at test time (ring).
rcgen = "0.14.10"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "json"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_WindowsProgramming", "Win32_System_SystemInformation"] }
ssh2 = { version = "0.9" }

[target.'cfg(not(target_os = "windows"))'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
signal-hook = { version = "0.4", features = ["iterator"] }
# O_NOFOLLOW for symlink-safe secure wipe.
libc = "0.2"
# Extended attributes and POSIX ACLs of copies (already in the tree through tar).
xattr = "1.6.1"

[package.metadata.deb]
name = "pairee"
maintainer = "FittyAr <10284757+FittyAr@users.noreply.github.com>"
license-file = ["LICENSE"]
section = "utils"
priority = "optional"
assets = [
    ["target/release/pairee", "usr/bin/pairee", "755"],
    ["lang/*", "usr/share/pairee/lang/", "644"],
    ["help/en/*", "usr/share/pairee/help/en/", "644"],
    ["help/es/*", "usr/share/pairee/help/es/", "644"],
    ["keymaps/*", "usr/share/pairee/keymaps/", "644"],
    ["manifests/linux/pairee.desktop", "usr/share/applications/pairee.desktop", "644"],
    ["img/pairee_logo.svg", "usr/share/icons/hicolor/scalable/apps/pairee.svg", "644"],
    ["manifests/msix/Assets/Square150x150Logo.png", "usr/share/pixmaps/pairee.png", "644"],
]

[package.metadata.generate-rpm]
name = "pairee"
summary = "A sleek, dual-panel terminal file manager"
description = "A modern Rust clone of Norton Commander with dual-panel layout, themes, and full mouse support."
license = "GPLv3"
categories = ["Applications/System"]
assets = [
    { source = "target/x86_64-unknown-linux-musl/release/pairee", dest = "/usr/bin/pairee", mode = "755" },
    { source = "lang/*", dest = "/usr/share/pairee/lang/", mode = "644" },
    { source = "help/en/*", dest = "/usr/share/pairee/help/en/", mode = "644" },
    { source = "help/es/*", dest = "/usr/share/pairee/help/es/", mode = "644" },
    { source = "keymaps/*", dest = "/usr/share/pairee/keymaps/", mode = "644" },
    { source = "manifests/linux/pairee.desktop", dest = "/usr/share/applications/pairee.desktop", mode = "644" },
    { source = "img/pairee_logo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/pairee.svg", mode = "644" },
    { source = "manifests/msix/Assets/Square150x150Logo.png", dest = "/usr/share/pixmaps/pairee.png", mode = "644" },
]

[build-dependencies]
embed-resource = "3.0"

# Lints for every target (lib, bins, tests, benches) of every workspace
# member; CI runs clippy with `-D warnings`.
[lints]
workspace = true

[workspace]
members = ["xtask"]
# cargo-fuzz targets build with nightly and their own lockfile.
exclude = ["fuzz"]

[workspace.lints.clippy]
too_many_lines = "warn"

[workspace.lints.rust]
# MSVC's link.exe reports the import library it writes for the symbols the
# vendored Lua exports ("Creating library pairee.lib and object pairee.exp");
# it is informational, and newer rustc turns any linker output into a warning.
linker_messages = "allow"
