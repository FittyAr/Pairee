# Rust. Format: see help "Syntax highlighting definitions"; credits in README.md.
name = "Rust"
extensions = ["rs"]

[[rule]]
kind = "type_name"
pattern = '\b[A-Z][A-Za-z0-9_]*\b'

[[rule]]
kind = "type_name"
words = ["bool", "char", "str", "u8", "u16", "u32", "u64", "u128", "usize",
         "i8", "i16", "i32", "i64", "i128", "isize", "f32", "f64"]

[[rule]]
kind = "function"
pattern = '\b([a-z_][A-Za-z0-9_]*)\s*(?:::<[^>()]*>)?\s*\('
group = 1

[[rule]]
kind = "function"
pattern = '\b[a-z_][A-Za-z0-9_]*!'

[[rule]]
kind = "function"
pattern = '#!?\[[^\]"]*\]?'

[[rule]]
kind = "type_name"
pattern = "'[a-z_][A-Za-z0-9_]*\\b"

[[rule]]
kind = "operator"
pattern = '[-+*/%=<>!&|^?]+'

[[rule]]
kind = "keyword"
words = ["as", "async", "await", "break", "const", "continue", "crate", "dyn", "else",
         "enum", "extern", "fn", "for", "if", "impl", "in", "let", "loop", "match", "mod",
         "move", "mut", "pub", "ref", "return", "self", "Self", "static", "struct", "super",
         "trait", "type", "unsafe", "use", "where", "while", "yield", "union", "macro_rules"]

[[rule]]
kind = "constant"
words = ["true", "false"]

[[rule]]
kind = "constant"
pattern = '\b(?:0x[0-9A-Fa-f_]+|0o[0-7_]+|0b[01_]+|[0-9][0-9_]*(?:\.[0-9][0-9_]*)?(?:[eE][+-]?[0-9_]+)?)(?:[iuf](?:8|16|32|64|128|size))?\b'

[[region]]
kind = "comment"
start = '//'
end = '$'

[[region.rule]]
kind = "keyword"
words = ["TODO", "FIXME", "XXX", "SAFETY"]

[[region]]
kind = "comment"
start = '/\*'
end = '\*/'

[[region]]
kind = "string"
start = '\bb?r#+"'
end = '"#+'

[[region]]
kind = "string"
start = '\bb?r"'
end = '"'

[[region]]
kind = "string"
start = 'b?"'
end = '"'
skip = '\\.'

[[region.rule]]
kind = "constant"
pattern = '\\(?:x[0-9A-Fa-f]{2}|u\{[0-9A-Fa-f_]*\}|.)'

[[region.rule]]
kind = "constant"
pattern = '\{[A-Za-z0-9_.:?#<>^+-]*\}'

# Character literals as one token, so a quote inside one ('"') opens no string.
[[region]]
kind = "constant"
start = '''b?'(?:\\(?:x[0-9A-Fa-f]{2}|u\{[0-9A-Fa-f_]*\}|.)|[^'\\])''''
end = ''
