# INI and similar key = value files. Format: see help "Syntax highlighting
# definitions"; credits in README.md.
name = "INI"
extensions = ["ini", "cfg", "conf", "inf", "properties", "desktop", "reg", "url", "service",
              "socket", "timer", "mount", "target", "prefs",
              "npmrc", "pylintrc", "flake8", "coveragerc"]
names = [".editorconfig", ".gitconfig", ".gitmodules", ".npmrc", ".pylintrc", ".flake8",
         ".coveragerc", "setup.cfg", "tox.ini", "pytest.ini", "mypy.ini", "desktop.ini",
         "php.ini", ".hgrc", "hgrc", ".wgetrc", ".curlrc"]

[[rule]]
kind = "type_name"
pattern = '^\s*\[[^\]]*\]'

[[rule]]
kind = "tag"
pattern = '^\s*([^=:;#\[\s][^=:]*?)\s*[=:]'
group = 1

[[rule]]
kind = "operator"
pattern = '^\s*[^=:;#\[\s][^=:]*?\s*([=:])'
group = 1

[[rule]]
kind = "constant"
pattern = '(?i)\b(?:true|false|yes|no|on|off|none|null)\b|\b[0-9]+(?:\.[0-9]+)?\b|%[A-Za-z0-9_()]+%?|\$\{[^}]*\}'

[[region]]
kind = "comment"
start = '^\s*[;#]'
end = '$'

[[region]]
kind = "string"
start = '"'
end = '"|$'
skip = '\\.'

[[region]]
kind = "string"
start = "(?:^|[=\\s])'"
end = "'|$"
