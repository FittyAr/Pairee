# Kotlin. Format: see help "Syntax highlighting definitions"; credits in README.md.
name = "Kotlin"
extensions = ["kt", "kts"]

[[rule]]
kind = "type_name"
pattern = '\b[A-Z][A-Za-z0-9_]*\b'

[[rule]]
kind = "function"
pattern = '\b([a-z_][A-Za-z0-9_]*)\s*(?:<[^<>()]*>)?\s*\('
group = 1

[[rule]]
kind = "function"
pattern = '@[A-Za-z_][A-Za-z0-9_.:]*'

[[rule]]
kind = "operator"
pattern = '[-+*/%=<>!&|?:]+|\.\.'

[[rule]]
kind = "keyword"
words = ["abstract", "actual", "annotation", "as", "break", "by", "catch", "class",
         "companion", "const", "constructor", "continue", "crossinline", "data", "do",
         "dynamic", "else", "enum", "expect", "external", "final", "finally", "for", "fun",
         "get", "if", "import", "in", "infix", "init", "inline", "inner", "interface",
         "internal", "is", "lateinit", "noinline", "object", "open", "operator", "out",
         "override", "package", "private", "protected", "public", "reified", "return",
         "sealed", "set", "super", "suspend", "tailrec", "this", "throw", "try", "typealias",
         "val", "var", "vararg", "when", "where", "while", "value"]

[[rule]]
kind = "constant"
words = ["true", "false", "null"]

[[rule]]
kind = "constant"
pattern = '\b(?:0[xX][0-9A-Fa-f_]+|0[bB][01_]+|[0-9][0-9_]*(?:\.[0-9_]+)?(?:[eE][+-]?[0-9]+)?)[uUlLfF]*\b'

[[region]]
kind = "comment"
start = '//'
end = '$'

[[region]]
kind = "comment"
start = '/\*'
end = '\*/'

[[region]]
kind = "string"
start = '"""'
end = '"""'

[[region.rule]]
kind = "constant"
pattern = '\$\{[^}]*\}|\$[A-Za-z_][A-Za-z0-9_]*'

[[region]]
kind = "string"
start = '"'
end = '"|$'
skip = '\\.'

[[region.rule]]
kind = "constant"
pattern = '\\(?:u[0-9A-Fa-f]{4}|.)|\$\{[^}]*\}|\$[A-Za-z_][A-Za-z0-9_]*'

[[region]]
kind = "constant"
start = ''''(?:\\(?:u[0-9A-Fa-f]{4}|.)|[^'\\])''''
end = ''
