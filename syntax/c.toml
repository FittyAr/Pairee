# C. Format: see help "Syntax highlighting definitions"; credits in README.md.
name = "C"
extensions = ["c", "h"]

[[rule]]
kind = "type_name"
words = ["char", "double", "float", "int", "long", "short", "signed", "unsigned", "void",
         "_Bool", "bool", "size_t", "ssize_t", "ptrdiff_t", "intptr_t", "uintptr_t",
         "int8_t", "int16_t", "int32_t", "int64_t", "uint8_t", "uint16_t", "uint32_t",
         "uint64_t", "FILE", "wchar_t"]

[[rule]]
kind = "type_name"
pattern = '\b[A-Za-z_][A-Za-z0-9_]*_t\b'

[[rule]]
kind = "function"
pattern = '\b([A-Za-z_][A-Za-z0-9_]*)\s*\('
group = 1

[[rule]]
kind = "operator"
pattern = '[-+*/%=<>!&|^~?]+'

[[rule]]
kind = "keyword"
words = ["auto", "break", "case", "const", "continue", "default", "do", "else", "enum",
         "extern", "for", "goto", "if", "inline", "register", "restrict", "return",
         "sizeof", "static", "struct", "switch", "typedef", "union", "volatile", "while",
         "_Alignas", "_Alignof", "_Atomic", "_Generic", "_Noreturn", "_Static_assert",
         "_Thread_local"]

[[rule]]
kind = "constant"
words = ["NULL", "true", "false", "EOF", "stdin", "stdout", "stderr"]

[[rule]]
kind = "constant"
pattern = '\b(?:0[xX][0-9A-Fa-f]+|0[bB][01]+|[0-9]+(?:\.[0-9]*)?(?:[eE][+-]?[0-9]+)?)[uUlLfF]*\b'

[[rule]]
kind = "keyword"
pattern = '^\s*#\s*[a-z]+'

[[rule]]
kind = "string"
pattern = '^\s*#\s*(?:include|import)\s*(<[^>]*>)'
group = 1

[[region]]
kind = "comment"
start = '//'
end = '$'

[[region]]
kind = "comment"
start = '/\*'
end = '\*/'

[[region]]
kind = "string"
start = '(?:L|u8|u|U)?"'
end = '"|$'
skip = '\\.'

[[region.rule]]
kind = "constant"
pattern = '\\(?:x[0-9A-Fa-f]+|[0-7]{1,3}|.)|%[-+ #0]*[0-9*]*(?:\.[0-9*]+)?[hlLzjt]*[diouxXeEfgGcspn%]'

[[region]]
kind = "constant"
start = '''(?:L|u8|u|U)?'(?:\\.|[^'\\])*''''
end = ''
