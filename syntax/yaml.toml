# YAML. Format: see help "Syntax highlighting definitions"; credits in README.md.
name = "YAML"
extensions = ["yaml", "yml", "eyaml", "sublime-syntax"]
names = [".clang-format", ".clang-tidy", ".clangd", ".gemrc", "pubspec.lock", ".yamllint"]
first_line = '^%YAML\b'

[[rule]]
kind = "tag"
pattern = '''^\s*(?:-\s+)?([^\s#:'"{\[][^#:]*?|"[^"]*"|'[^']*')\s*:(?:\s|$)'''
group = 1

[[rule]]
kind = "operator"
pattern = '^\s*-(?:\s|$)|^(?:---|\.\.\.)\s*$|[|>][-+]?\s*$|[{}\[\],?]'

[[rule]]
kind = "type_name"
pattern = '[&*][A-Za-z0-9_.-]+|!!?[A-Za-z0-9_./-]*'

[[rule]]
kind = "constant"
pattern = '(?:^|[\s:\[,-])((?:true|false|yes|no|on|off|null|True|False|Yes|No|On|Off|Null|NULL|TRUE|FALSE|~))\s*(?:$|[,\]}#])'
group = 1

[[rule]]
kind = "constant"
pattern = '(?:^|[\s:\[,-])([-+]?(?:0x[0-9A-Fa-f]+|0o[0-7]+|[0-9][0-9_]*(?:\.[0-9]*)?(?:[eE][+-]?[0-9]+)?|\.inf|\.nan))\s*(?:$|[,\]}#])'
group = 1

[[rule]]
kind = "constant"
pattern = '[0-9]{4}-[0-9]{2}-[0-9]{2}(?:[Tt ][0-9:.]+(?:Z|[+-][0-9:]+)?)?'

[[region]]
kind = "comment"
start = '(?:^|\s)#'
end = '$'

[[region]]
kind = "keyword"
start = '^%'
end = '$'

[[region]]
kind = "string"
start = '"'
end = '"'
skip = '\\.'

[[region.rule]]
kind = "constant"
pattern = '\\(?:x[0-9A-Fa-f]{2}|u[0-9A-Fa-f]{4}|U[0-9A-Fa-f]{8}|.)'

[[region]]
kind = "string"
start = "(?:^|[\\s:\\[{,-])'"
end = "'"
skip = "''"
